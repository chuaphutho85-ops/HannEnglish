<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng Ký Tư Vấn | Hann English</title>

  <!-- GOOGLE FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    /* =========================
       RESET CSS
    ========================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:
      linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.85)),
      url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;

      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px;
    }

    /* =========================
       FORM CONTAINER
    ========================== */

    .form-container{
      width:100%;
      max-width:600px;
      background:white;
      border-radius:30px;
      padding:45px;
      box-shadow:0 20px 50px rgba(0,0,0,0.15);
    }

    .logo{
      text-align:center;
      margin-bottom:20px;
    }

    .logo img{
      width:90px;
      height:90px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #38bdf8;
    }

    h1{
      text-align:center;
      color:#0f172a;
      margin-bottom:12px;
      font-size:2.3rem;
    }

    .subtitle{
      text-align:center;
      color:#64748b;
      margin-bottom:35px;
      line-height:1.7;
    }

    /* =========================
       FORM
    ========================== */

    .input-group{
      margin-bottom:22px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:600;
      color:#0f172a;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:16px;
      border-radius:16px;
      border:1px solid #cbd5e1;
      font-size:1rem;
      font-family:'Poppins',sans-serif;
      transition:0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus{
      outline:none;
      border-color:#38bdf8;
      box-shadow:0 0 0 4px rgba(56,189,248,0.15);
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    /* =========================
       BUTTON
    ========================== */

    .submit-btn{
      width:100%;
      border:none;
      background:#38bdf8;
      color:white;
      padding:18px;
      border-radius:50px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
      box-shadow:0 10px 25px rgba(56,189,248,0.3);
    }

    .submit-btn:hover{
      background:#0ea5e9;
      transform:translateY(-3px);
    }

    /* =========================
       EXTRA LINKS
    ========================== */

    .extra-links{
      margin-top:28px;
      text-align:center;
    }

    .extra-links a{
      color:#38bdf8;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .extra-links a:hover{
      color:#0ea5e9;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:768px){

      .form-container{
        padding:30px;
      }

      h1{
        font-size:1.9rem;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       FORM BOX
  ========================== -->

  <div class="form-container">

    <!-- LOGO -->

    <div class="logo">

      <img 
        src="https://yt3.ggpht.com/s7MiNGwFfUfh3vK_AXi-6KmuxjkFszTGXIFc45ddRSfaEDeY6KB941THQzRxS0CXxPlnbpQ2Rw=s600-c-k-c0x00ffffff-no-rj-rp-mo"
        alt="Hann English">

    </div>

    <!-- TITLE -->

    <h1>Đăng Ký Tư Vấn</h1>

    <p class="subtitle">
      Điền thông tin bên dưới để nhận lộ trình học tiếng Anh phù hợp
      cùng Hann English hoàn toàn miễn phí.
    </p>

    <!-- FORM -->

    <form action="cam-on.html">

      <!-- NAME -->

      <div class="input-group">

        <label>Họ và tên</label>

        <input 
          type="text"
          placeholder="Nhập họ và tên của bạn"
          required>

      </div>

      <!-- PHONE -->

      <div class="input-group">

        <label>Số điện thoại</label>

        <input 
          type="tel"
          placeholder="Nhập số điện thoại"
          required>

      </div>

      <!-- EMAIL -->

      <div class="input-group">

        <label>Email</label>

        <input 
          type="email"
          placeholder="example@gmail.com">

      </div>

      <!-- LEVEL -->

      <div class="input-group">

        <label>Trình độ hiện tại</label>

        <select>

          <option>Chưa biết tiếng Anh</option>

          <option>Mất gốc tiếng Anh</option>

          <option>Giao tiếp cơ bản</option>

          <option>IELTS / TOEIC</option>

          <option>Muốn nâng cao 4 kỹ năng</option>

        </select>

      </div>

      <!-- GOAL -->

      <div class="input-group">

        <label>Mục tiêu học tập</label>

        <textarea placeholder="Ví dụ: Giao tiếp tự tin, luyện IELTS, cải thiện kỹ năng nghe nói..."></textarea>

      </div>

      <!-- BUTTON -->

      <button class="submit-btn">
        Gửi Đăng Ký Tư Vấn
      </button>

    </form>

    <!-- EXTRA LINKS -->

    <div class="extra-links">

      <p>
        Hoặc liên hệ trực tiếp qua 
        <a href="https://youtube.com/@hannenglish-w2k?si=nNxVXVmbjdAzgzK4" target="_blank">
          Hann English YouTube
        </a>
      </p>

    </div>

  </div>

</body>
</html>
